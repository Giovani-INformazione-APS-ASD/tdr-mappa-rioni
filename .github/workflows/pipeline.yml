name: Deploy

on:
  push:
    branches:
      - master

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Run Tests
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cd .
          go test -v ./...

      - name: Build Binary
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o tdr-map

      - name: Stop Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl stop api.tdr-map.service || true

      - name: Copy Binary and Map File to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "tdr-map,map.geojson"
          target: "/var/www/tdr-map/"

      - name: Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod +x /var/www/tdr-map/tdr-map
            sudo systemctl restart api.tdr-map.service
